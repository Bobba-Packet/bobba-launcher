name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Bobba Launcher ${{ github.ref_name }}
          releaseBody: |
            Production build of Bobba Launcher `${{ github.ref_name }}`.

            ## Downloads
            - **Setup installer** (`.exe`) — recommended
            - Plain binary also attached when available

            Versioning is managed via GitHub Releases. The launcher can auto-download updates from the latest release.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadPlainBinary: true
          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
